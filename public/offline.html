<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a5f" />
    <title>Offline - Quincaillerie Manager</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f4f8; color: #172033; font: 14px Inter, "Segoe UI", sans-serif; }
      main { max-width: 420px; margin: 24px; padding: 32px; border: 1px solid #d8dee8; border-radius: 12px; background: white; text-align: center; box-shadow: 0 8px 24px rgb(15 23 42 / 8%); }
      h1 { margin: 16px 0 8px; font-size: 22px; }
      p { margin: 0; color: #586579; line-height: 1.6; }
      button { margin-top: 20px; border: 0; border-radius: 8px; background: #1e3a5f; color: white; padding: 10px 16px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to continue using Quincaillerie Manager. Unsaved or queued writes remain pending until the server confirms them.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
